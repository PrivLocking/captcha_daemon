<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAPTCHA Verification</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .captcha-container { text-align: center; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
        .captcha-image { margin-bottom: 10px; }
        .error { color: red; display: none; }
    </style>
</head>
<body>
    <div class="captcha-container">
        <h2>Please Verify</h2>
        <img class="captcha-image" src="/captcha_png" alt="CAPTCHA">
        <form id="captcha-form" action="/captcha_auth" method="GET">
            <input type="text" name="answer" maxlength="6" placeholder="Enter CAPTCHA code" required>
            <input type="submit" value="Submit">
        </form>
        <p class="error" id="error-msg">Incorrect CAPTCHA code</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('error') === 'incorrect') {
                document.getElementById('error-msg').style.display = 'block';
            }
        });
    </script>
</body>
</html>
